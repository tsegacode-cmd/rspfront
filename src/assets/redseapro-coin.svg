<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title description">
  <title id="title">RedSeaPro Coin</title>
  <desc id="description">A gold virtual reward coin branded RedSeaPro Coin.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#092c43"/>
      <stop offset="1" stop-color="#0c5363"/>
    </linearGradient>
    <radialGradient id="coin" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#fff5b8"/>
      <stop offset=".45" stop-color="#f3c85b"/>
      <stop offset="1" stop-color="#b9771d"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a3"/>
      <stop offset=".5" stop-color="#d99b32"/>
      <stop offset="1" stop-color="#ffe28a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#001722" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="960" height="520" rx="28" fill="url(#background)"/>
  <circle cx="480" cy="260" r="204" fill="url(#rim)" filter="url(#shadow)"/>
  <circle cx="480" cy="260" r="184" fill="url(#coin)" stroke="#fff0a3" stroke-width="5"/>
  <circle cx="480" cy="260" r="164" fill="none" stroke="#a96e1c" stroke-opacity=".72" stroke-width="3"/>
  <circle cx="480" cy="260" r="150" fill="none" stroke="#fff2ae" stroke-opacity=".78" stroke-width="2" stroke-dasharray="3 10"/>
  <path d="M480 130 504 207 585 207 520 254 545 331 480 283 415 331 440 254 375 207 456 207Z" fill="#fff0aa" stroke="#b67a24" stroke-width="4" stroke-linejoin="round"/>
  <text x="480" y="374" fill="#633e12" font-family="Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="5" text-anchor="middle">REDSEAPRO</text>
  <text x="480" y="410" fill="#633e12" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="9" text-anchor="middle">COIN</text>
  <text x="480" y="478" fill="#f8e7b3" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4" text-anchor="middle">VIRTUAL REWARDS</text>
</svg>
